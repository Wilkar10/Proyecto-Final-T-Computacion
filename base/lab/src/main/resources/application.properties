# ===== Modo LITE (por defecto): H2 en memoria, sin Redis ni RabbitMQ =====
spring.application.name=logistpulse-lab
server.port=8080

# Jersey en la raíz: la API vive en /api/** y Actuator en /actuator/**
spring.jersey.application-path=/

# Datos
spring.datasource.url=jdbc:h2:mem:logistpulse;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Cache local, sin Redis
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Mensajería desactivada: el evento solo se escribe en el log
lab.messaging.enabled=false

# Transportista externo (WireMock). Puedes levantar solo ese contenedor: docker compose up carrier-mock
lab.carrier.base-url=${CARRIER_URL:http://localhost:9091}

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.metrics.tags.application=logistpulse-lab

# ===== Capa de API: seguridad y límite de tasa (ver docs/ARQUITECTURA_MICROSERVICIOS_API_FIRST.md §8) =====
# Autenticación X-Api-Key: APAGADA en modo lite (para probar fácil); el perfil docker la enciende.
lab.security.enabled=false
lab.security.api-keys=
lab.security.trust-forwarded-for=false
# Rate limit (token bucket): ráfaga 20, recarga 10 fichas/s por cliente => 429 + Retry-After
lab.security.rate-limit.enabled=true
lab.security.rate-limit.burst=20
lab.security.rate-limit.refill-per-second=10
lab.security.rate-limit.store=memory
# El X-Request-Id aparece en cada línea de log
logging.pattern.level=%5p [%X{requestId:-}]

# Packing: capacidad de caja (unidades de volumen)
lab.packing.box-capacity=10
