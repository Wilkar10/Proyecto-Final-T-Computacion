# ===== Perfil docker: stack completo (Postgres + Redis + RabbitMQ + WireMock) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:logistpulse}
spring.datasource.username=${DB_USER:logistpulse}
spring.datasource.password=${DB_PASSWORD:logistpulse}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

lab.messaging.enabled=true
lab.carrier.base-url=${CARRIER_URL:http://carrier-mock:8080}

management.health.redis.enabled=true
management.health.rabbit.enabled=true

# ===== Capa de API en modo docker =====
# Claves de DESARROLLO (están en el repositorio a propósito; cámbialas con LAB_API_KEYS fuera del aula).
lab.security.enabled=true
lab.security.api-keys=${LAB_API_KEYS:dispatcher:lab-dev-dispatcher-key:read,write;viewer:lab-dev-viewer-key:read}
# En docker el límite se comparte en Redis (varias réplicas = una sola cubeta por cliente)
lab.security.rate-limit.store=redis
lab.security.rate-limit.burst=${LAB_RATE_BURST:20}
lab.security.rate-limit.refill-per-second=${LAB_RATE_REFILL:10}
# El gateway (Kong) reescribe X-Forwarded-For; por eso aquí sí se confía en él
lab.security.trust-forwarded-for=${LAB_TRUST_FORWARDED_FOR:false}
