global:
  scrape_interval: 5s

scrape_configs:
  - job_name: logistpulse-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]

  # Agente de despacho (base/agent). Solo responde si se levantó con `make up-agent`.
  - job_name: logistpulse-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8090"]
