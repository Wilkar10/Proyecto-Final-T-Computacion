name: ci-deber-diseno
on:
  push:
    branches: [main]
    paths: ['deberes/diseno-sistemas/**', 'base/agent/**', '.github/workflows/ci-deber-diseno.yml']
  pull_request:
    paths: ['deberes/diseno-sistemas/**', 'base/agent/**', '.github/workflows/ci-deber-diseno.yml']
permissions:
  contents: read
concurrency:
  group: ci-deber-diseno-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deberes/diseno-sistemas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pytest
      - name: Base (bloqueante)
        run: python -m pytest -q
