name: ci-seguridad-sast
# SAST + SCA + secretos: análisis ESTÁTICO (no necesita levantar la aplicación). Corre en GitHub Actions.
# Ya existía codeql.yml (SAST de Java y Python) y el escaneo Trivy de la imagen del lab en ci-lab.yml; este flujo agrega lo que faltaba.
# Los resultados SARIF aparecen en la pestaña Security > Code scanning del repositorio.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'        # lunes: aparecen CVE nuevas aunque el código no cambie
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-seguridad-sast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bandit:
    name: SAST Python (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install bandit
      # Falla con hallazgos de severidad MEDIA o ALTA. Exclusiones y su razón: .bandit
      - run: >
          bandit -r base/agent base/decision_lab deberes contracts/tools base/lakehouse
          -c .bandit -x '*/tests/*,deberes/bases-de-datos/ci/*' -ll

  spotbugs:
    name: SAST Java (SpotBugs + Find Security Bugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -Psast -DskipTests compile spotbugs:check
        working-directory: base/lab
      - name: Informe de SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: base/lab/target/spotbugsXml.xml
          if-no-files-found: ignore

  semgrep:
    name: SAST multilenguaje (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container: {image: semgrep/semgrep}
    steps:
      - uses: actions/checkout@v4
      - run: >
          semgrep scan --metrics=off --error --sarif --output semgrep.sarif
          --config p/owasp-top-ten --config p/java --config p/python --config p/dockerfile --config p/secrets .
      - name: Subir SARIF a Code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: semgrep.sarif, category: semgrep}

  pip-audit:
    name: SCA Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pip-audit
      - name: Dependencias del lakehouse
        run: pip-audit -r base/lakehouse/services/requirements.txt
      - name: Dependencias opcionales del agente (pg, llm; el núcleo no tiene dependencias)
        run: |
          printf 'psycopg2-binary>=2.9\nanthropic>=0.40\n' > agent-extras.txt
          pip-audit -r agent-extras.txt

  trivy-repo:
    name: SCA + secretos + IaC (Trivy sobre el repositorio)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Bloquea: vulnerabilidades CRITICAL/HIGH con corrección disponible (pom.xml, pyproject, requirements) y SECRETOS.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivy-config: base/gateway/trivy.yaml
          exit-code: '1'
          format: sarif
          output: trivy-repo.sarif
      - name: Subir SARIF a Code scanning
        if: always() && hashFiles('trivy-repo.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy-repo.sarif, category: trivy-repo}
      # Informativo (no bloquea): Dockerfiles y docker-compose mal configurados (root, sin healthcheck, etc.)
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          format: table

  imagen-agente:
    name: SCA de la imagen del agente (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: {context: base/agent, push: false, load: true, tags: 'logistpulse-agent:ci'}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: logistpulse-agent:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  revision-de-dependencias:
    name: Revisión de dependencias del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Requiere activar "Dependency graph" en Settings > Code security (ver docs/SEGURIDAD_CICD.md)
      - uses: actions/dependency-review-action@v4
        with: {fail-on-severity: high}
