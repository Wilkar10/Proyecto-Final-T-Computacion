name: ci-agent
on:
  push:
    branches: [main]
    paths: ['base/agent/**', 'base/decision_lab/**', '.github/workflows/ci-agent.yml']
  pull_request:
    paths: ['base/agent/**', 'base/decision_lab/**', '.github/workflows/ci-agent.yml']
permissions:
  contents: read
concurrency:
  group: ci-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q
        working-directory: base/agent
      - run: python -m pytest -q
        working-directory: base/decision_lab
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: base/agent
          push: false
