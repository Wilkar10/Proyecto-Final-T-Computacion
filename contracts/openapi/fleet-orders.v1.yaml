openapi: 3.0.3
info:
  title: LOGISTPULSE · Pedidos y Flota
  version: 1.1.0
  description: |
    Contexto acotado "Pedidos y Flota". Contrato-primero: este archivo manda; el código Java debe cumplirlo.
    Documenta lo que el lab YA expone (orders, robots, routes) y el endpoint de viajes /api/trips.
    Publicación: el gateway (Kong) expone estas rutas como /api/v1/** (ver x-gateway) y exige X-Api-Key.
servers:
  - {url: "http://localhost:8080", description: "directo al servicio (docker compose; en modo docker también exige X-Api-Key)"}
security:
  - ApiKey: []
x-gateway: {public_base_path: /api/v1, upstream_prefix: /api, enforced_by: [gateway, service]}
paths:
  /api/orders:
    get:
      operationId: listOrders
      x-required-scope: read
      summary: Lista pedidos (paginado)
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '200': {description: Página de pedidos, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPage'}}}}
  /api/orders/{id}:
    get:
      operationId: getOrder
      x-required-scope: read
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '200': {description: Pedido, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /api/robots:
    get:
      operationId: listRobots
      x-required-scope: read
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '200': {description: Flota, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Robot'}}}}}
  /api/trips:
    post:
      operationId: createTrip
      x-required-scope: write
      summary: Despacha UN viaje multi-parada con un robot, de forma atómica (todo o nada)
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: X-Request-Id, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TripInput'}}}
      responses:
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '201': {description: Viaje creado; emite order.dispatched por pedido vía Outbox, content: {application/json: {schema: {$ref: '#/components/schemas/Trip'}}}}
        '200': {description: Repetición con la misma Idempotency-Key (Idempotent-Replay), content: {application/json: {schema: {$ref: '#/components/schemas/Trip'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Clave por cliente, validada por el gateway (y por el servicio fleet-orders como defensa en profundidad).
        Permisos: `read` = GET/HEAD/OPTIONS; `write` = POST/PUT/PATCH/DELETE (ver `x-required-scope` en cada operación).
  schemas:
    OrderStatus: {type: string, enum: [CREATED, DISPATCHED, IN_TRANSIT, DELIVERED, CANCELLED]}
    Order:
      type: object
      required: [id, code, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, example: LP-DEMO01}
        status: {$ref: '#/components/schemas/OrderStatus'}
        tripId: {type: integer, format: int64, nullable: true}
    OrderPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Order'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    Robot:
      type: object
      required: [id, code, battery, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, example: AMR-01}
        battery: {type: integer, minimum: 0, maximum: 100}
        status: {type: string}
    TripInput:
      type: object
      required: [robot, orders]
      additionalProperties: false
      properties:
        robot: {type: string, example: AMR-01}
        orders: {type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: {type: string}}
    Trip:
      type: object
      required: [id, idempotencyKey, robot, orders, cost, createdAt]
      properties:
        id: {type: integer, format: int64}
        idempotencyKey: {type: string}
        robot: {type: string}
        orders: {type: array, items: {type: string}}
        cost: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}, status: {type: integer}, code: {type: string, example: ROBOT_UNAVAILABLE}}
  responses:
    Unauthorized:
      description: Falta la clave X-Api-Key o es inválida
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        WWW-Authenticate: {schema: {type: string}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: La clave es válida pero no tiene el permiso (scope) que exige la operación
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TooManyRequests:
      description: >-
        Límite de tasa excedido (cubeta de fichas: ráfaga 20, recarga 10 por segundo y por cliente).
        Espere Retry-After segundos. Si responde el gateway el cuerpo es {"message":"RATE_LIMITED"};
        si responde el servicio, usa el esquema Error con code RATE_LIMITED.
      headers:
        Retry-After: {description: Segundos a esperar antes de reintentar, schema: {type: integer, minimum: 1}}
        X-RateLimit-Limit: {description: Capacidad de la cubeta (ráfaga), schema: {type: integer}}
        X-RateLimit-Remaining: {description: Fichas restantes, schema: {type: integer}}
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  headers:
    RequestId: {description: Identificador de correlación (se acepta el del cliente si es seguro; si no se genera uno), schema: {type: string}}
