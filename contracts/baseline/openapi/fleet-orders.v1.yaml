openapi: 3.0.3
info:
  title: LOGISTPULSE · Pedidos y Flota
  version: 1.0.0
  description: |
    Contexto acotado "Pedidos y Flota". Contrato-primero: este archivo manda; el código Java debe cumplirlo.
    Documenta lo que el lab YA expone (orders, robots, routes) y el endpoint de viajes /api/trips.
servers:
  - {url: "http://localhost:8080", description: local (docker compose)}
paths:
  /api/orders:
    get:
      operationId: listOrders
      summary: Lista pedidos (paginado)
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        '200': {description: Página de pedidos, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPage'}}}}
  /api/orders/{id}:
    get:
      operationId: getOrder
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses:
        '200': {description: Pedido, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
        '404': {$ref: '#/components/responses/Error'}
  /api/robots:
    get:
      operationId: listRobots
      responses:
        '200': {description: Flota, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Robot'}}}}}
  /api/trips:
    post:
      operationId: createTrip
      summary: Despacha UN viaje multi-parada con un robot, de forma atómica (todo o nada)
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - {name: X-Request-Id, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TripInput'}}}
      responses:
        '201': {description: Viaje creado; emite order.dispatched por pedido vía Outbox, content: {application/json: {schema: {$ref: '#/components/schemas/Trip'}}}}
        '200': {description: Repetición con la misma Idempotency-Key (Idempotent-Replay), content: {application/json: {schema: {$ref: '#/components/schemas/Trip'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
components:
  schemas:
    OrderStatus: {type: string, enum: [CREATED, DISPATCHED, IN_TRANSIT, DELIVERED, CANCELLED]}
    Order:
      type: object
      required: [id, code, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, example: LP-DEMO01}
        status: {$ref: '#/components/schemas/OrderStatus'}
        tripId: {type: integer, format: int64, nullable: true}
    OrderPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Order'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    Robot:
      type: object
      required: [id, code, battery, status]
      properties:
        id: {type: integer, format: int64}
        code: {type: string, example: AMR-01}
        battery: {type: integer, minimum: 0, maximum: 100}
        status: {type: string}
    TripInput:
      type: object
      required: [robot, orders]
      additionalProperties: false
      properties:
        robot: {type: string, example: AMR-01}
        orders: {type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: {type: string}}
    Trip:
      type: object
      required: [id, idempotencyKey, robot, orders, cost, createdAt]
      properties:
        id: {type: integer, format: int64}
        idempotencyKey: {type: string}
        robot: {type: string}
        orders: {type: array, items: {type: string}}
        cost: {type: integer, minimum: 0}
        createdAt: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}, code: {type: string, example: ROBOT_UNAVAILABLE}}
  responses:
    Error: {description: Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
